services:
  - type: web
    name: nirapod-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/nirapod
    envVars:
      - key: NODE_VERSION
        value: 16.20.2
      - key: NIRAPOD_API_URL
        sync: false
      - key: NIRAPOD_DEMO_PASSWORD
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/runtime-config.js
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
